<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#17324d" />
    <title>LexiEcho</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="sidebar-header">
          <a class="brand" href="#home" data-route="home">
            <span><strong>LexiEcho</strong></span>
          </a>
          <button id="sidebar-toggle" class="icon-button" aria-label="收起侧边栏">◀</button>
        </div>
        <nav>
          <a href="#home" data-route="home" class="nav-link active">概览</a>
          <a href="#new" data-route="new" class="nav-link">创建学习</a>
          <a href="#archive" data-route="archive" class="nav-link">学习档案</a>
          <a href="#settings" data-route="settings" class="nav-link">模型与数据</a>
        </nav>
      </aside>

      <main id="app" tabindex="-1"></main>
    </div>

    <template id="home-template">
      <section class="page hero-page">
        <div class="hero-copy">
          <h1>LexiEcho 英语强化工具</h1>
          <p class="lead">导入今日词表，自动生成定制化的自然例句与阅读短文。</p>
          <div class="actions">
            <a class="button primary" href="#new">创建今日学习</a>
            <a class="button secondary" href="#archive">查看学习档案</a>
          </div>
        </div>
      </section>
      <section class="page compact-section">
        <div class="section-heading"><h2>最近学习</h2></div>
        <div id="recent-sessions" class="session-grid"></div>
      </section>
    </template>

    <template id="new-template">
      <section class="page page-header">
        <h1>创建学习</h1>
      </section>
      <section class="page two-columns form-layout">
        <form id="new-study-form" class="card form-card">
          <label>日期<input id="study-date" type="date" required /></label>
          <label>今日词表
            <textarea id="word-list" rows="10" placeholder="每行一个单词或短语，例如：&#10;prove&#10;identify&#10;be responsible for"></textarea>
          </label>
          <label>附加要求（可选）
            <textarea id="session-note" rows="3" placeholder="例如：侧重职场交流场景"></textarea>
          </label>
          <button class="button primary wide" id="submit-btn" type="submit">
            <span class="btn-text">生成强化内容</span>
            <div class="spinner hidden"></div>
          </button>
        </form>
      </section>
    </template>

    <template id="archive-template">
      <section class="page page-header">
        <h1>学习档案</h1>
        <p>长按日期查看简略，点击进入详情记录。</p>
      </section>
      <section class="page">
        <div class="calendar-card card">
          <header class="calendar-header">
            <button id="prev-month" class="icon-button">◀</button>
            <h2 id="calendar-title"></h2>
            <button id="next-month" class="icon-button">▶</button>
          </header>
          <div class="calendar-grid-header">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </section>
    </template>

    <template id="settings-template">
      <section class="page page-header">
        <h1>模型与数据</h1>
      </section>
      <section class="page two-columns settings-layout">
        <form id="provider-form" class="card form-card">
          <label>供应商预设
            <select id="provider-preset">
              <option value="deepseek">DeepSeek</option>
              <option value="kimi">Kimi (Moonshot)</option>
              <option value="custom">自定义兼容接口</option>
            </select>
          </label>
          <label>接口地址<input id="provider-url" type="url" required /></label>
          <label>模型名称
            <!-- 预设模型原生下拉框，自定义模式切换为输入框，解决 iPad 下拉位置偏移 Bug -->
            <select id="provider-model-select"></select>
            <input id="provider-model-input" type="text" style="display:none;" />
          </label>
          <label>API Key<input id="provider-key" type="password" placeholder="保存在本设备" /></label>
          <button type="submit" class="button primary wide">保存配置</button>
          <p id="provider-status" class="form-status"></p>
        </form>
        <section class="card data-card">
          <div class="stacked-actions">
            <button id="export-data" type="button" class="button secondary wide">导出档案备份</button>
            <button id="clear-data" type="button" class="button danger wide">清空本地数据</button>
          </div>
        </section>
      </section>
    </template>

    <script src="app.js"></script>
  </body>
</html>
