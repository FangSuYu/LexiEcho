<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#17324d" />
    <title>LexiEcho - 词境回声</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- 引入 html2canvas 用于一键导出单词卡片为图片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="sidebar-header">
          <a class="brand" href="#home" data-route="home">
            <span><strong>LexiEcho</strong></span>
          </a>
          <button id="sidebar-toggle" class="icon-button" aria-label="收起侧边栏">◀</button>
        </div>
        <nav>
          <a href="#home" data-route="home" class="nav-link active">概览</a>
          <a href="#new" data-route="new" class="nav-link">创建学习</a>
          <a href="#archive" data-route="archive" class="nav-link">学习档案</a>
          <a href="#settings" data-route="settings" class="nav-link">模型与数据</a>
        </nav>
      </aside>

      <main id="app" tabindex="-1"></main>
    </div>

    <!-- 全页面生成提示动画遮罩 -->
    <div id="full-page-loading" class="full-page-loading hidden">
      <div class="full-page-spinner"></div>
      <h3 style="margin:0 0 10px 0; font-size:20px;">AI 正在生成深度强化学习内容...</h3>
      <p style="margin:0; opacity:0.85; font-size:14px; max-width:400px; line-height:1.6;">正在拆解单词例句，并生成词汇串连短文与三梯度专项阅读短文，请稍候</p>
    </div>

    <template id="home-template">
      <section class="page hero-page">
        <div class="hero-copy">
          <h1>LexiEcho 英语语境强化</h1>
          <p class="lead">导入今日词表，生成定制化零基础友好例句与深度阅读短文。</p>
          <div class="actions">
            <a class="button primary" href="#new">创建今日学习</a>
            <a class="button secondary" href="#archive">查看学习档案</a>
          </div>
        </div>
      </section>
      <section class="page compact-section">
        <div class="section-heading"><h2>最近学习记录</h2></div>
        <div id="recent-sessions" class="session-grid"></div>
      </section>
    </template>

    <template id="new-template">
      <section class="page page-header">
        <h1>创建今日学习</h1>
      </section>
      <section class="page two-columns form-layout">
        <form id="new-study-form" class="card form-card">
          <label>日期<input id="study-date" type="date" required /></label>
          <label>今日词表
            <textarea id="word-list" rows="8" placeholder="每行一个单词或短语，例如：&#10;prove&#10;identify&#10;be responsible for"></textarea>
          </label>
          <label>附加要求（可选）
            <textarea id="session-note" rows="3" placeholder="例如：基础较弱，希望能多一些日常生活的贴切表达"></textarea>
          </label>
          <button class="button primary wide" id="submit-btn" type="submit">
            <span class="btn-text">生成深度强化内容</span>
            <div class="spinner hidden"></div>
          </button>
        </form>
      </section>
    </template>

    <template id="archive-template">
      <section class="page page-header">
        <h1>学习档案</h1>
        <p>日历可查看对应日期记录；可在下方列表中快捷管理与清理档案。</p>
      </section>
      <section class="page">
        <div class="calendar-card card">
          <header class="calendar-header">
            <button id="prev-month" class="icon-button">◀</button>
            <h2 id="calendar-title"></h2>
            <button id="next-month" class="icon-button">▶</button>
          </header>
          <div class="calendar-grid-header">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <!-- 学习档案管理删除列表 -->
        <div class="archive-list-container card">
          <div class="archive-list-header">
            <h3>📂 档案管理与清理</h3>
          </div>
          <div id="archive-list" class="archive-list"></div>
        </div>
      </section>
    </template>

    <template id="settings-template">
      <section class="page page-header">
        <h1>模型与数据配置</h1>
      </section>
      <section class="page two-columns settings-layout">
        <form id="provider-form" class="card form-card">
          <label>供应商预设
            <select id="provider-preset">
              <option value="deepseek">DeepSeek</option>
              <option value="kimi">Kimi (Moonshot)</option>
              <option value="custom">自定义兼容接口</option>
            </select>
          </label>
          <label>接口地址<input id="provider-url" type="url" required /></label>
          <label>模型名称
            <select id="provider-model-select"></select>
            <input id="provider-model-input" type="text" style="display:none;" />
          </label>
          <label>API Key<input id="provider-key" type="password" placeholder="仅保存在本地设备" /></label>
          <button type="submit" class="button primary wide">保存配置</button>
          <p id="provider-status" class="form-status"></p>
        </form>
        <section class="card data-card">
          <div class="stacked-actions">
            <button id="export-data" type="button" class="button secondary wide">导出档案备份 (.json)</button>
            <label class="button secondary wide" style="text-align:center; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; justify-content:center;">
              导入档案备份
              <input id="import-data-file" type="file" accept=".json" style="display:none;" />
            </label>
            <button id="clear-data" type="button" class="button danger wide">清空本地数据</button>
          </div>
        </section>
      </section>
    </template>

    <!-- 加载核心客户端脚本 -->
    <script src="modelClient.js"></script>
    <script src="app.js"></script>
  </body>
</html>
